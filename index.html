<style>
:root{color-scheme:light;--page:#f4f3ee;--card:#fcfcfb;--line:#cfccc1;--ink:#16150f;--ink2:#55534b;--accent:#16150f;--on:#fcfcfb;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--page:#121210;--card:#1c1b19;--line:#47443e;--ink:#f0efec;--ink2:#c3c2b7;--accent:#f0efec;--on:#1c1b19;--err:#f2968f}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--page);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic","Noto Sans KR",sans-serif;padding:16px}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:12px}
h1{font-size:20px;margin:0}
input[type=password]{width:100%;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:16px}
label{display:flex;gap:8px;align-items:center;color:var(--ink2);font-size:13.5px;min-height:28px}
button{height:46px;border:0;border-radius:8px;background:var(--accent);color:var(--on);font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
p{margin:0;font-size:13.5px;min-height:20px}
p.err{color:var(--err)}
</style>

<p id="m" role="status"></p>

const $=i=>document.getElementById(i);
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const text=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
function get(){try{return localStorage.getItem(KEY)}catch(e){return null}}
function put(v){try{v?localStorage.setItem(KEY,v):localStorage.removeItem(KEY)}catch(e){}}
async function unlock(raw){
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(NONCE)},key,bytes(DATA));
  const html=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("deflate"))).text();
  document.open();document.write(html);document.close();
}
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:bytes(SALT),iterations:ITER},base,256);
}
$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  $("b").disabled=true;$("m").className="";$("m").textContent="여는 중입니다...";
  try{
    const raw=await derive($("p").value);
    const saved=$("r").checked?text(raw):null;
    await unlock(raw);
    put(saved);
  }catch(err){
    $("m").className="err";$("m").textContent="비밀번호가 맞지 않습니다. 다시 입력해 주세요.";$("b").disabled=false;$("p").select();
  }
});
(async()=>{
  const saved=get();
  if(saved){try{await unlock(bytes(saved));return;}catch(e){put(null);}}
  $("f").hidden=false;$("p").focus();
})();
})();
</script>
